[project]
name = "architecture-toolkit"
version = "0.1.0"
description = "Typed architecture models, coherent releases and standards projections"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "datafusion>=54.0.0,<55",
    "deltalake>=1.6.4,<1.7",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "networkx>=3.6.1",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
architecture = "architecture_toolkit.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.82",
]
docs = [
    "mkdocs>=1.6.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ty.environment]
python-version = "3.14"
