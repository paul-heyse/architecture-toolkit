[project]
name = "architecture-toolkit"
version = "0.1.0"
description = "Typed architecture models, coherent releases and standards projections"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "datafusion>=54.0.0,<55",
    "deltalake>=1.6.4,<1.7",
    "jinja2>=3.1.6",
    "lxml>=6.1.3",
    "networkx>=3.6.1",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
architecture = "architecture_toolkit.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "jsonschema>=4.26.0",
    "pyrefly>=1.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "types-jsonschema>=4.26.0.20260518",
    "types-lxml>=2026.2.16",
    "types-networkx>=3.6.1.20260911",
]
docs = [
    "mkdocs>=1.6.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
# CORE-63 baseline plus the CORE-64 expansion, qualified against this tree: RUF, PT and PTH
# report nothing today; S reports only the reviewed clusters excepted below.
select = ["E", "F", "I", "UP", "B", "RUF", "PT", "PTH", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests assert. CORE-64 asks for narrow reviewed exceptions rather than dropping the family.
"tests/**" = ["S101"]
# Vendor and git invocations are argument arrays resolved from PATH, never shell strings, with
# explicit timeouts. rules/no-shell-invocation.yml enforces the argv form structurally.
"scripts/*.py" = ["S603", "S607"]
# The evidence plugin resolves the toolkit commit the same way, with the same argv discipline.
"tests/plugins/*.py" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests` is a package so the evidence plugin can be loaded by dotted path and test module
# basenames cannot collide.
pythonpath = ["."]
# --strict-markers (CORE-48): an unregistered marker is an error, not a silent no-op, so a typo in
# a requirement marker cannot quietly drop evidence.
addopts = "-ra --strict-markers -p tests.plugins.requirement_evidence"
# xfail_strict (CORE-52): a known limitation must state its upstream reason and must fail loudly
# once it is fixed.
xfail_strict = true
# CORE-45: Hypothesis cannot read a Pydantic constraint. `st.from_type` on a constrained alias
# warns and then yields values that fail validation, so the warning has to be fatal — otherwise a
# strategy silently generates invalid data and the property it guards proves nothing. This only
# fires for `StringConstraints`; `Field(pattern=...)` warns not at all, which is why
# `tests/unit/test_identifiers.py` separately pins the alias style.
filterwarnings = ["error::hypothesis.errors.HypothesisWarning"]
markers = [
    "unit: isolated behaviour of one module",
    "property: Hypothesis-generated invariant",
    "integration: several toolkit layers together",
    "interop: a real third-party library boundary",
    "vendor: an external tool binary is invoked",
    "qualification: evidence for an acceptance requirement",
    "platform: behaviour that genuinely differs by platform",
    "slow: excluded from the default developer loop",
    "requirement(id): acceptance requirement this test evidences, e.g. CORE-49",
]

# D-032: Pyrefly replaces ty as the target static type checker.
[tool.pyrefly]
# CORE-57: check source, tests and executable scripts, not just src.
project-includes = ["src", "tests", "scripts"]
project-excludes = [".tools/**", ".runtime/**", "site/**", ".venv/**"]
# `scripts/` is a search path because a script run as `python scripts/x.py` gets its own
# directory on sys.path, which is how `scripts/_common.py` is imported. `.` is here so
# `tests.strategies` resolves the same way pytest's `pythonpath = ["."]` makes it resolve at
# run time; without it the strategy package type-checks as a missing import.
search-path = ["src", "scripts", "."]
python-version = "3.14"
# CORE-55: a mismatched checker is a fatal configuration error, independent of the lock.
required-version = ">=1.3.1,<1.4.0"
# CORE-54: configured explicitly; never unconfigured or basic mode. Matches the current default,
# set so that a future default change cannot silently relax the project.
check-unannotated-defs = true
# CORE-60: no `baseline` key. Suppressions are narrow `# pyrefly: ignore[error-code]` comments.

# CORE-61: measure coverage over the package only. `project-includes` above keeps the *check*
# surface wide; this keeps the *measurement* surface from being diluted by test bodies.
[tool.pyrefly.coverage]
includes = ["src"]
