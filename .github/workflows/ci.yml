name: Foundation qualification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    name: Python 3.14 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      AST_GREP_VERSION: "0.45.3"
      AST_GREP_TARGET: ${{ matrix.os == 'macos-14' && 'aarch64-apple-darwin' || 'x86_64-unknown-linux-gnu' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: 0.12.7
          python-version: 3.14.7
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyrefly check
      - run: uv run pyrefly coverage check --strict --fail-under 85
      - run: uv run pytest --junitxml=.runtime/junit.xml
      - run: uv run python scripts/check_schema.py
      - run: uv run python scripts/check_plan_coverage.py
      - name: Install ast-grep
        run: |
          curl -fsSL --proto '=https' -o ast-grep.zip \
            "https://github.com/ast-grep/ast-grep/releases/download/${AST_GREP_VERSION}/app-${AST_GREP_TARGET}.zip"
          unzip -q ast-grep.zip -d "$RUNNER_TEMP/ast-grep"
          chmod +x "$RUNNER_TEMP/ast-grep/ast-grep"
          echo "$RUNNER_TEMP/ast-grep" >> "$GITHUB_PATH"
      - run: ast-grep scan
      - run: ast-grep test
      - run: uv run architecture validate examples/minimal/model.yaml
      - run: uv run --group docs mkdocs build --strict
      - name: Install Graphviz (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Install Graphviz (macOS)
        if: runner.os == 'macOS'
        run: brew install graphviz
      - run: uv run python scripts/bootstrap_tools.py
      - run: uv run python scripts/qualify_tools.py
      - name: Archive qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualification-evidence-${{ matrix.os }}
          path: .runtime/
          if-no-files-found: warn
