id: releases-no-direct-delta
language: python
severity: error
message: The release layer reaches Delta only through storage/delta.py.
note: |
  implementation-contract.md gives `storage` "Delta persistence" and `releases` "manifest,
  semantic diff, migration, lock/staging/publication". DATA-20 then forbids treating a Delta
  table version as an architecture release, and DATA-51 requires version-pinned reads to go
  through the storage boundary so interoperability can change without changing release
  semantics.

  The publication protocol is an application protocol layered above a storage engine that
  offers no multi-table atomicity. A release module importing deltalake directly would put
  those two layers in one place, which is exactly the confusion DATA-20 exists to prevent.

  Matches the module-name node, so `import x`, `import x as y` and `from x import y` are all
  covered by one anchored expression.
files:
  - "src/architecture_toolkit/releases/**/*.py"
rule:
  kind: dotted_name
  regex: ^deltalake(\..+)?$
  any:
    - inside:
        kind: import_statement
        stopBy: end
    - inside:
        kind: import_from_statement
        field: module_name
