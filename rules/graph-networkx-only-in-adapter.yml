id: graph-networkx-only-in-adapter
language: python
severity: error
message: Reach NetworkX through queries/_nx.py, not directly.
note: |
  CORE-22 and CORE-24: NetworkX is a disposable analysis projection behind an `ArchitectureGraph`
  facade, and the raw `MultiDiGraph` has no public mutation API. Confining every `nx.` call to one
  adapter is what makes that true structurally rather than by convention, and it is where the
  narrow `types-networkx` suppressions live — the stub types multigraph edge keys as `int` where
  CORE-23 makes ours canonical relationship IDs, and answering that once beats answering it at
  every call site.

  Matches the module-name node, so `import x`, `import x as y` and `from x import y` are all
  covered by one anchored expression. `ast-grep test` cannot exercise the `ignores` glob;
  `tests/unit/test_layering.py` proves that half.
files:
  - src/architecture_toolkit/**/*.py
ignores:
  - src/architecture_toolkit/queries/_nx.py
rule:
  kind: dotted_name
  regex: ^networkx(\..+)?$
  any:
    - inside:
        kind: import_statement
        stopBy: end
    - inside:
        kind: import_from_statement
        field: module_name
